<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The monogram on transparency, not the studio render it was cut from: the
      old JPEG carried the mockup's slate wall with it, which showed up as a
      grey tile in every browser tab and on every home screen.
    -->
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />

    <title>GenieWep Technologies | Software Development Company in Uganda</title>
    <meta
      name="description"
      content="GenieWep Technologies builds websites, web apps, mobile apps and desktop software for businesses, schools, NGOs, SACCOs and tourism companies in Uganda. 5 years of experience."
    />
    <meta name="author" content="GenieWep Technologies" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071726" media="(prefers-color-scheme: dark)" />

    <!--
      Resolve the theme before first paint. Without this the page renders in the
      default light theme for a frame and then snaps to dark, which reads as a
      flash on every single navigation for dark-mode visitors.
      Kept inline and dependency-free so it runs before any bundle loads.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('geniewep-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="canonical" href="https://geniewep.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GenieWep Technologies" />

    <meta property="og:locale" content="en_UG" />

    <!-- Twitter -->

    <!--
